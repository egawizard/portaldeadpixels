<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>PORTAL — DEAD PIXELS LABS</title>
<meta name="description" content="PORTAL // COMING SOON" />
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="black"/><rect x="8" y="8" width="48" height="48" fill="none" stroke="white" stroke-width="4"/><rect x="22" y="22" width="20" height="20" fill="white"/></svg>'>
<style>
:root{
  --bg:#000;
  --white:#f2f2f2;
  --muted:#8a8a8a;
  --line:rgba(255,255,255,.16);
  --cyan:#00f0ff;
  --red:#ff2448;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--white);overflow:hidden}
body{font-family:"Courier New",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;cursor:crosshair}
button,a{font:inherit}
::selection{background:#fff;color:#000}

#stage{
  position:relative;width:100vw;height:100svh;overflow:hidden;background:#000;
  isolation:isolate;
}
#voidCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}

.vignette{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  background:
    radial-gradient(circle at center, transparent 0 21%, rgba(0,0,0,.05) 30%, rgba(0,0,0,.38) 64%, rgba(0,0,0,.9) 100%),
    linear-gradient(to bottom,rgba(255,255,255,.018),transparent 14%,transparent 82%,rgba(255,255,255,.02));
}
.scanlines{
  position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.28;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);
  mix-blend-mode:screen;
}
.noise{
  position:absolute;inset:-60px;z-index:8;pointer-events:none;opacity:.14;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  animation:noise .16s steps(2) infinite;
}
@keyframes noise{0%{transform:translate(0,0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(2%,2%)}100%{transform:translate(-1%,1%)}}

.chrome{
  position:absolute;z-index:20;left:0;right:0;top:0;height:48px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(#050505d9,#0007);
  backdrop-filter:blur(5px);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700}
.brand .sq{width:8px;height:8px;background:#fff;box-shadow:-5px 0 0 var(--red),5px 0 0 var(--cyan)}
.status{display:flex;align-items:center;gap:8px;color:#8d8d8d}
.status i{display:block;width:5px;height:5px;background:#fff;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:.08}}

.corner{
  position:absolute;z-index:21;font-size:10px;letter-spacing:.13em;color:#777;text-transform:uppercase;line-height:1.55;
  pointer-events:none;
}
.c1{left:18px;top:72px}.c2{right:18px;top:72px;text-align:right}
.c3{left:18px;bottom:18px}.c4{right:18px;bottom:18px;text-align:right}

.center{
  position:absolute;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(94vw,980px);text-align:center;pointer-events:none;
}
.portal-label{
  font-size:10px;letter-spacing:.48em;text-transform:uppercase;color:#999;margin-bottom:clamp(280px,45vh,480px);
}
.coming{
  position:relative;display:inline-block;
  font-family:Arial,Helvetica,sans-serif;font-size:clamp(50px,9vw,130px);font-weight:900;line-height:.78;
  letter-spacing:-.075em;text-transform:uppercase;color:#f1f1f1;
  filter:contrast(1.2);
}
.coming::before,.coming::after{
  content:attr(data-text);position:absolute;inset:0;pointer-events:none;
}
.coming::before{color:var(--cyan);transform:translate(-2px,0);clip-path:polygon(0 16%,100% 16%,100% 26%,0 26%);opacity:.65;animation:shift1 2.6s infinite steps(1)}
.coming::after{color:var(--red);transform:translate(2px,0);clip-path:polygon(0 63%,100% 63%,100% 72%,0 72%);opacity:.7;animation:shift2 2.1s infinite steps(1)}
@keyframes shift1{0%,88%,100%{transform:translate(-2px,0)}89%{transform:translate(-14px,2px)}91%{transform:translate(8px,-1px)}}
@keyframes shift2{0%,91%,100%{transform:translate(2px,0)}92%{transform:translate(14px,-2px)}94%{transform:translate(-8px,1px)}}

.url{
  margin-top:22px;font-size:11px;letter-spacing:.29em;text-transform:uppercase;color:#8c8c8c;
}
.micro{
  margin-top:12px;font-size:9px;letter-spacing:.36em;color:#4e4e4e;text-transform:uppercase;
}

.crosshair{position:absolute;z-index:22;width:24px;height:24px;opacity:.65;pointer-events:none}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:#fff}
.crosshair::before{left:0;top:0;width:12px;height:1px;box-shadow:0 23px 0 #fff}
.crosshair::after{left:0;top:0;width:1px;height:12px;box-shadow:23px 0 0 #fff}
.x1{left:26px;top:118px}.x2{right:26px;bottom:84px;transform:rotate(180deg)}

.tear{
  position:absolute;left:-5vw;right:-5vw;height:3px;z-index:15;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 0 5%,#fff 9%,transparent 17%,rgba(0,240,255,.9) 31%,transparent 38%,rgba(255,36,72,.9) 64%,transparent 70%);
  filter:blur(.2px);
  animation:tear 5.7s infinite steps(1);
}
@keyframes tear{
  0%,84%,100%{opacity:0;top:20%;transform:translateX(0)}
  85%{opacity:.55;top:32%;transform:translateX(4%)}
  86%{opacity:.9;top:57%;transform:translateX(-3%)}
  87%{opacity:.2;top:75%;transform:translateX(7%)}
  88%{opacity:0}
}

.flash{
  position:absolute;inset:0;z-index:16;background:#fff;opacity:0;pointer-events:none;
  animation:flash 11s infinite steps(1);
}
@keyframes flash{0%,96%,100%{opacity:0}96.2%{opacity:.035}96.4%{opacity:0}96.8%{opacity:.018}97%{opacity:0}}

#cursorDistort{
  position:absolute;z-index:11;width:240px;height:240px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,255,255,.045),transparent 58%);
  mix-blend-mode:screen;filter:blur(1px);opacity:.65;
}

@media(max-width:700px){
  .chrome{height:44px;padding:0 12px;font-size:9px}
  .corner{font-size:8px}
  .c1,.c2{top:60px}
  .portal-label{margin-bottom:44vh;font-size:8px;letter-spacing:.33em}
  .url{font-size:9px;letter-spacing:.15em}
  .micro{font-size:7px;letter-spacing:.18em}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="voidCanvas"></canvas>

  <div class="chrome">
    <div class="brand"><span class="sq"></span>DEAD PIXELS LABS // PORTAL</div>
    <div class="status"><i></i>NO SIGNAL</div>
  </div>

  <div class="corner c1">ACCESS // DENIED<br>CHANNEL // NULL</div>
  <div class="corner c2">PORTAL<br>COMING SOON</div>
  <div class="corner c3">ERROR MAKES US UNIQUE.</div>
  <div class="corner c4">PORTAL.DEADPIXELSLABS.COM</div>

  <div class="crosshair x1"></div>
  <div class="crosshair x2"></div>

  <div class="center">
    <div class="portal-label">PORTAL // OFFLINE</div>
    <div class="coming" data-text="COMING SOON">COMING SOON</div>
    <div class="url">portal.deadpixelslabs.com</div>
    <div class="micro">NO CLUE // NO ACCESS // NO SIGNAL</div>
  </div>

  <div id="cursorDistort"></div>
  <div class="tear"></div>
  <div class="flash"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="noise"></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('voidCanvas');
  const ctx = canvas.getContext('2d', { alpha:false });
  let w=0,h=0,dpr=1,cx=0,cy=0,baseR=0,t=0;
  let mouse={x:.5,y:.5,tx:.5,ty:.5};
  const particles=[], stars=[], blocks=[];

  function rnd(a,b){return a+Math.random()*(b-a)}
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    w=innerWidth; h=innerHeight;
    canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx=w/2;cy=h*.48;baseR=Math.min(w,h)*.19;
    particles.length=0;stars.length=0;blocks.length=0;
    const pc=Math.round(Math.min(1100,Math.max(420,w*h/1800)));
    for(let i=0;i<pc;i++){
      particles.push({
        a:rnd(0,Math.PI*2), r:rnd(baseR*.72,baseR*2.35),
        z:rnd(.2,1), s:rnd(.7,3.6), sp:rnd(.0006,.003),
        o:rnd(.08,.85), type:Math.random()<.18?1:0
      });
    }
    for(let i=0;i<Math.round(w*h/16000);i++){
      stars.push({x:Math.random()*w,y:Math.random()*h,s:rnd(.5,1.8),o:rnd(.05,.45)});
    }
    for(let i=0;i<80;i++){
      blocks.push({
        a:rnd(0,Math.PI*2),r:rnd(baseR*1.05,baseR*2.4),sz:rnd(2,16),
        sp:rnd(.0008,.0025),o:rnd(.05,.32),phase:rnd(0,10)
      })
    }
  }

  function draw(){
    t++;
    ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);

    // stars
    for(const s of stars){
      ctx.globalAlpha=s.o*(.75+.25*Math.sin((t+s.x)*.01));
      ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.s,s.s);
    }

    // subtle horizon reflection
    const grd=ctx.createLinearGradient(0,cy+baseR*.9,0,h);
    grd.addColorStop(0,'rgba(255,255,255,0)');
    grd.addColorStop(.35,'rgba(255,255,255,.025)');
    grd.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalAlpha=1;ctx.fillStyle=grd;ctx.fillRect(0,cy+baseR*.8,w,h-(cy+baseR*.8));

    const mx=(mouse.x-.5)*18, my=(mouse.y-.5)*10;
    const centerX=cx+mx, centerY=cy+my;

    // warped accretion arcs
    ctx.save();
    ctx.translate(centerX,centerY);
    ctx.lineCap='butt';
    for(let k=0;k<34;k++){
      const rr=baseR*(.93+k*.035);
      const ang=t*.0015*(k%2?1:-1)+k*.17;
      const len=Math.PI*rnd(.18,.7);
      ctx.globalAlpha=.035+(k%7)*.01;
      ctx.strokeStyle=k%6===0?'#00eaff':k%5===0?'#ff2448':'#e8e8e8';
      ctx.lineWidth=rnd(.4,2.4);
      ctx.beginPath();
      ctx.ellipse(0,0,rr,rr*.78,ang*.02,ang,ang+len);
      ctx.stroke();
    }
    ctx.restore();

    // particles swirling into void
    for(const p of particles){
      p.a += p.sp*(1.2+p.z);
      const wob=Math.sin(t*.008+p.r)*5*p.z;
      const squash=.76;
      const x=centerX+Math.cos(p.a)*(p.r+wob);
      const y=centerY+Math.sin(p.a)*(p.r+wob)*squash;
      const tang=Math.atan2(Math.cos(p.a)*squash,-Math.sin(p.a));
      const speedGlow=(Math.sin(p.a*3+t*.01)+1)*.5;
      ctx.save();ctx.translate(x,y);ctx.rotate(tang);
      ctx.globalAlpha=p.o*(.55+.45*speedGlow);
      if(p.type){
        ctx.fillStyle=(Math.floor(p.a*10)%9===0)?'#00f0ff':(Math.floor(p.a*13)%11===0?'#ff2448':'#ddd');
        const ww=p.s*rnd(2,5);ctx.fillRect(-ww/2,-p.s/2,ww,p.s);
      }else{
        ctx.fillStyle='#e8e8e8';ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
      }
      ctx.restore();
    }

    // floating glitch blocks
    for(const b of blocks){
      b.a+=b.sp;
      const x=centerX+Math.cos(b.a)*b.r;
      const y=centerY+Math.sin(b.a)*b.r*.72;
      const flick=.2+.8*Math.max(0,Math.sin(t*.03+b.phase));
      ctx.globalAlpha=b.o*flick;
      ctx.fillStyle=Math.random()<.006?'#00f0ff':'#aaa';
      ctx.fillRect(x,y,b.sz,b.sz*rnd(.4,1.4));
    }

    // event horizon
    let g=ctx.createRadialGradient(centerX,centerY,baseR*.48,centerX,centerY,baseR*1.18);
    g.addColorStop(0,'#000');
    g.addColorStop(.58,'#000');
    g.addColorStop(.76,'rgba(0,0,0,.98)');
    g.addColorStop(.86,'rgba(255,255,255,.08)');
    g.addColorStop(.95,'rgba(0,0,0,.9)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=1;ctx.fillStyle=g;ctx.beginPath();ctx.arc(centerX,centerY,baseR*1.23,0,Math.PI*2);ctx.fill();

    // pure black center
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(centerX,centerY,baseR*.66,0,Math.PI*2);ctx.fill();

    // rare RGB split flash around horizon
    if(t%241<3){
      ctx.globalAlpha=.28;
      ctx.strokeStyle='#00f0ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(centerX-4,centerY,baseR*.72,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#ff2448';ctx.beginPath();ctx.arc(centerX+4,centerY,baseR*.72,0,Math.PI*2);ctx.stroke();
    }

    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }

  addEventListener('resize',resize,{passive:true});
  addEventListener('pointermove',e=>{
    mouse.tx=e.clientX/w;mouse.ty=e.clientY/h;
    mouse.x += (mouse.tx-mouse.x)*.28;
    mouse.y += (mouse.ty-mouse.y)*.28;
    const d=document.getElementById('cursorDistort');
    d.style.left=e.clientX+'px';d.style.top=e.clientY+'px';
  },{passive:true});

  // click = harmless glitch burst, no reveal
  addEventListener('pointerdown',()=>{
    document.body.animate([
      {filter:'none'},
      {filter:'contrast(1.3) saturate(.25) hue-rotate(8deg)'},
      {filter:'none'}
    ],{duration:150,easing:'steps(2)'});
  });

  resize(); draw();
})();
</script>
</body>
</html>
